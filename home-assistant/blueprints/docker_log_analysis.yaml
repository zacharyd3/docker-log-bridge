blueprint:
  name: Docker log analysis (AI Task)
  author: zacharyd3
  description: >
    Every few minutes, pulls the last N minutes of container logs from
    [docker-log-bridge](https://github.com/zacharyd3/docker-log-bridge)
    (local socket + remote Docker hosts, the same ones Dozzle reads), has an
    AI Task entity analyse them with `ai_task.generate_data`, and notifies you
    when something needs attention.


    **One-time setup:** add the `rest_command.docker_log_bridge` snippet from
    the repo's `home-assistant/README.md` to `configuration.yaml` and restart.


    Every run also fires a `docker_log_analysis` event (status, summary,
    issues, counts, hosts, ...). The package and dashboard in the repo's
    `home-assistant/` folder turn it into a status page.
  domain: automation
  source_url: https://github.com/zacharyd3/docker-log-bridge/blob/main/home-assistant/blueprints/docker_log_analysis.yaml
  homeassistant:
    min_version: "2025.8.0"
  input:
    bridge_section:
      name: Bridge
      icon: mdi:docker
      input:
        bridge_url:
          name: Bridge URL
          description: Base URL of the docker-log-bridge container (no trailing path).
          default: http://192.168.250.4:8084
          selector:
            text:
              type: url
        rest_command_action:
          name: REST command
          description: >
            The rest_command you added to configuration.yaml. Only change this
            if you named it something other than docker_log_bridge.
          default: rest_command.docker_log_bridge
          selector:
            text:

    schedule_section:
      name: Schedule
      icon: mdi:clock-outline
      input:
        interval:
          name: Run every
          default: "/10"
          selector:
            select:
              options:
                - label: 5 minutes
                  value: "/5"
                - label: 10 minutes
                  value: "/10"
                - label: 15 minutes
                  value: "/15"
                - label: 20 minutes
                  value: "/20"
                - label: 30 minutes
                  value: "/30"
        lookback:
          name: Look back (minutes)
          description: >
            How much log history each run analyses. 0 = same as the run
            interval, so every line is looked at exactly once.
          default: 0
          selector:
            number:
              min: 0
              max: 1440
              unit_of_measurement: min
              mode: box

    filter_section:
      name: What to read
      icon: mdi:filter-outline
      collapsed: true
      input:
        hosts:
          name: Docker hosts
          description: >
            Comma-separated host labels from the bridge's DOCKER_HOSTS
            (e.g. "Unraid, Thor"). Empty = all hosts.
          default: ""
          selector:
            text:
        containers:
          name: Only these containers
          description: >
            Comma-separated names or globs. `plex`, `*arr`, `Thor/*` all work.
            Empty = every container.
          default: ""
          selector:
            text:
        exclude:
          name: Exclude containers
          description: Comma-separated names or globs to skip (e.g. "dozzle, docker-log-bridge").
          default: ""
          selector:
            text:
        ignore:
          name: Ignore lines matching (regex)
          description: >
            Case-insensitive regular expression; matching lines are dropped
            before analysis. e.g. `GET /(health|ping)|Session .* expired`.
          default: ""
          selector:
            text:
        level:
          name: Minimum level sent to the AI
          description: >
            "Warnings & errors" keeps prompts small and cheap; "Everything"
            gives the AI more context. Container state problems (crash loops,
            unhealthy, OOM, unreachable hosts) are always included.
          default: warning
          selector:
            select:
              options:
                - label: Everything (incl. debug)
                  value: all
                - label: Info and above
                  value: info
                - label: Warnings & errors
                  value: warning
                - label: Errors only
                  value: error
        max_chars:
          name: Max report size (characters)
          description: >
            Upper bound on the text sent to the AI (~4 characters per token).
            The bridge keeps the most severe lines when it has to trim.
          default: 40000
          selector:
            number:
              min: 2000
              max: 400000
              step: 1000
              mode: box

    ai_section:
      name: AI analysis
      icon: mdi:robot-outline
      input:
        ai_task_entity:
          name: AI Task entity
          description: Leave empty to use your default AI Task entity.
          default: ""
          selector:
            entity:
              filter:
                domain: ai_task
        extra_instructions:
          name: Extra instructions
          description: >
            Context about your setup, things to ignore, or what to focus on.
            e.g. "Thor runs the media stack; Plex transcoder warnings are normal."
          default: ""
          selector:
            text:
              multiline: true
        strictness:
          name: What counts as an issue
          description: >
            "Anything I could fix" reports every error you could act on, even
            when the container keeps running: a failed import, a missing path
            or permission, bad credentials, a misconfigured integration, or a
            job that keeps failing. "Only outages" reports only things that are
            down or at risk: crashes, restart loops, failing health checks,
            unreachable hosts, full disks and data-loss risks.
          default: fixable
          selector:
            select:
              options:
                - label: Anything I could fix (recommended)
                  value: fixable
                - label: Only outages and failures
                  value: outages
        skip_when_quiet:
          name: Skip AI when nothing looks wrong
          description: >
            Don't call the AI at all when the window has no warnings/errors,
            no container state problems and every host answered. Saves tokens.
          default: true
          selector:
            boolean:

    notify_section:
      name: Notifications
      icon: mdi:bell-outline
      input:
        min_severity:
          name: Notify at
          default: warning
          selector:
            select:
              options:
                - label: Warning or worse
                  value: warning
                - label: Critical only
                  value: critical
        persistent_notification:
          name: Show a persistent notification
          description: Replaces the previous one, so they don't pile up.
          default: true
          selector:
            boolean:
        notify_bridge_errors:
          name: Notify when the bridge can't be reached
          default: true
          selector:
            boolean:
        notify_actions:
          name: Extra actions
          description: >
            Run when an analysis meets the threshold, e.g. a mobile push.
            Available variables: `analysis.status`, `analysis.summary`,
            `analysis.issues`, `notification_title`, `notification_message`
            (markdown), and `phone_message` (the same as plain text for mobile pushes).
          default: []
          selector:
            action:

triggers:
  - trigger: time_pattern
    minutes: !input interval

mode: single
max_exceeded: silent

variables:
  bridge_url: !input bridge_url
  interval: !input interval
  lookback: !input lookback
  hosts: !input hosts
  containers: !input containers
  exclude: !input exclude
  ignore: !input ignore
  level: !input level
  max_chars: !input max_chars
  ai_task_entity: !input ai_task_entity
  extra_instructions: !input extra_instructions
  skip_when_quiet: !input skip_when_quiet
  strictness: !input strictness
  min_severity: !input min_severity
  persistent_notification: !input persistent_notification
  notify_bridge_errors: !input notify_bridge_errors
  window_minutes: >-
    {{ lookback | int(0) if lookback | int(0) > 0 else interval | replace('/', '') | int(10) }}
  severity_rank: {ok: 0, warning: 1, critical: 2}

actions:
  - action: !input rest_command_action
    data:
      url: "{{ bridge_url | regex_replace('/+$', '') }}/api/logs"
      params:
        minutes: "{{ window_minutes }}"
        level: "{{ level }}"
        hosts: "{{ hosts }}"
        containers: "{{ containers }}"
        exclude: "{{ exclude }}"
        ignore: "{{ ignore }}"
        max_chars: "{{ max_chars | int(40000) }}"
    response_variable: bridge
    continue_on_error: true

  - variables:
      bridge_ok: >-
        {{ bridge is defined and bridge.status | default(0) == 200
           and bridge.content is mapping and 'text' in bridge.content }}

  - if: "{{ not bridge_ok }}"
    then:
      - if: "{{ notify_bridge_errors }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: docker_log_bridge_error
              title: Docker log bridge unreachable
              message: >-
                Couldn't fetch logs from {{ bridge_url }}
                {%- if bridge is defined %} (HTTP {{ bridge.status | default('?') }}:
                {{ (bridge.content | default('') | string)[:300] }}){% endif %}.
                Check that the container is running and that
                rest_command.docker_log_bridge is configured.
      - event: docker_log_analysis
        event_data:
          status: error
          summary: Couldn't reach the docker-log-bridge at {{ bridge_url }}.
          issues: ""
          analysed: false
          automation: "{{ this.entity_id }}"
          window_minutes: "{{ window_minutes }}"
          generated_at: "{{ now().isoformat(timespec='seconds') }}"
      - stop: Bridge request failed

  - action: persistent_notification.dismiss
    data:
      notification_id: docker_log_bridge_error

  - variables:
      report: "{{ bridge.content }}"

  - if: "{{ skip_when_quiet and not report.has_findings }}"
    then:
      - event: docker_log_analysis
        event_data:
          status: ok
          summary: No warnings, errors or container problems in the last {{ window_minutes }} minutes.
          issues: ""
          analysed: false
          # Everything a dashboard needs from the bridge's report; reused below.
          <<: &report_fields
            automation: "{{ this.entity_id }}"
            window_minutes: "{{ window_minutes }}"
            generated_at: "{{ report.generated_at }}"
            errors: "{{ report.stats.errors }}"
            warnings: "{{ report.stats.warnings }}"
            problems: "{{ report.problems }}"
            hosts_down: "{{ report.hosts_down }}"
            hosts: "{{ report.hosts }}"
            noisiest: "{{ report.noisiest | default([]) }}"
            containers_scanned: "{{ report.stats.containers_scanned }}"
            containers_with_output: "{{ report.stats.containers_with_output }}"
            raw_lines: "{{ report.stats.raw_lines }}"
            elapsed_ms: "{{ report.stats.elapsed_ms | default(none) }}"
      - stop: Nothing worth analysing

  - variables:
      ai_instructions: |-
        You are a site-reliability engineer reviewing Docker container logs from a home lab.
        The report below covers the last {{ window_minutes }} minutes from these Docker hosts:
        {{ report.hosts | map(attribute='name') | join(', ') }}.
        Repeated lines are collapsed with (xN) counts and indented lines belong to the line
        above them. [E]/[W]/[I]/[D] levels are a keyword heuristic and can be wrong.

        Decide whether anything needs the owner's attention.
        {%- if strictness == 'outages' %}
        The owner only wants outages and failures reported:
        - Report: unreachable hosts, crash or restart loops, failing health checks, OOM kills,
          disk-full / database / filesystem errors, persistent connection or authentication
          failures, and anything that risks data loss.
        - Do not report configuration problems while the service is otherwise running.
        {%- else %}
        The owner wants to know about anything they could fix or tune, not just outages.
        A container that is up but failing at its job is an issue. Report:
        - Anything in the outage list: unreachable hosts, crash or restart loops, failing
          health checks, OOM kills, disk-full / database / filesystem errors, data-loss risk.
        - Errors where the app can't do what it's for, even though the container is running:
          failed imports, downloads, backups, syncs or scheduled jobs; a "path does not exist",
          "permission denied" or "not accessible" error; a missing mount or volume; bad or
          expired credentials or API keys; an integration that fails to load or set up; a
          dependency (database, broker, upstream API, another container) it can't reach.
        - Any error-level message that repeats in the window, and any warning that repeats
          many times. Something that recurs is not transient.
        - Misconfiguration you can see in the logs, with the setting to change.
        A configuration or permission error IS actionable: never call it "just a config issue"
        or "not an active failure". Explain what is broken because of it, e.g. "Radarr can't
        import this movie, so it never reaches the library".
        {%- endif %}
        - Treat as noise only if it is one-off and recovered, or normal operation: a single
          timeout followed by success, deprecation notices, debug chatter, normal startup
          messages, routine HTTP access logs, health-check pings.
        - A container that "started during window" may just have been updated. Only flag it if
          its logs show it failing.
        - Only list a line if it shows something not working or needing a change. Do not
          report a line just because it contains "warn", "skip" or "empty", or because it is
          a tip about command-line flags; read what it actually says.
        - Merge issues that share a root cause, even across containers or hosts. At most 8
          issues, most important first.
        - Every problem you mention in the summary must also appear in issues, with its fix.
        - Be specific: name host/container, quote the key error briefly, say what it breaks,
          and give the most likely cause and the concrete fix (which setting, path mapping,
          permission or container to change). Do not invent problems that are not in the report.
        - Status: "critical" if something is down or data is at risk now; "warning" for anything
          else you reported; "ok" only if there is nothing to report, in which case issues is
          empty.
        {%- if extra_instructions | trim %}

        Notes from the owner about this setup:
        {{ extra_instructions | trim }}
        {%- endif %}

        ===== REPORT =====
        {{ report.text }}

  - if: "{{ ai_task_entity | default('', true) | length > 0 }}"
    then:
      - action: ai_task.generate_data
        data:
          task_name: Docker log analysis
          entity_id: "{{ ai_task_entity }}"
          instructions: "{{ ai_instructions }}"
          structure: &ai_structure
            status:
              description: >-
                ok = nothing to report; warning = something the owner should fix
                (including config, path or permission errors); critical = something is
                down or data is at risk now.
              required: true
              selector:
                select:
                  options:
                    - ok
                    - warning
                    - critical
            summary:
              description: One or two plain sentences suitable for a phone notification.
              required: true
              selector:
                text:
            issues:
              description: >-
                One entry per distinct issue (at most 8, most important first), each a
                single sentence formatted "Host/container: what is wrong and what it
                breaks -> the fix", e.g. "Thor/radarr: imports fail because
                /Downloads/Movies is missing or unreadable, so movies never reach the
                library -> fix the download client's path mapping". Every problem named
                in the summary must have an entry. Empty list only when status is ok.
              required: true
              selector:
                text:
                  multiple: true
        response_variable: ai
    else:
      # Same call without entity_id, so HA uses the default AI Task entity.
      - action: ai_task.generate_data
        data:
          task_name: Docker log analysis
          instructions: "{{ ai_instructions }}"
          structure: *ai_structure
        response_variable: ai

  # Some models (often local ones) return the issues as JSON - a real list or
  # a string holding one - instead of the requested text lines. Turn either
  # into "- Host/container: problem. What it breaks -> fix" lines.
  - variables:
      issues_text: >-
        {% set raw = ai.data.issues | default('') %}
        {# A one-item list holding a JSON blob or several lines: unwrap it. #}
        {% if raw is list and raw | length == 1 and raw[0] is string %}{% set raw = raw[0] %}{% endif %}
        {% set parsed = raw %}
        {% if raw is string %}
          {% set j = raw | trim | regex_replace('^[^\\[\\{]*', '') %}
          {% set parsed = (j | from_json(default=none)) if j[:1] in ['[', '{'] else (raw | trim).split('\n') %}
        {% endif %}
        {% if parsed is mapping %}{% set parsed = [parsed] %}{% endif %}
        {% set ns = namespace(lines=[]) %}
        {% if parsed is not none and parsed is not string and parsed is iterable %}
          {% for i in parsed %}
            {% if i is mapping %}
              {% set who = [i.host, i.container] | select | join('/') %}
              {% set problem = i.problem or i.message or i.issue or i.description or i.error or '' %}
              {% set breaks = i.what_it_breaks or i.impact or '' %}
              {% set fix = i.fix or i.suggested_fix or i.solution or i.action or '' %}
              {% set line = (who ~ ': ' if who else '') ~ (problem | string | trim)
                            ~ ('. ' ~ (breaks | string | trim) if breaks else '')
                            ~ (' -> ' ~ (fix | string | trim) if fix else '') %}
            {% else %}
              {% set line = i | string | trim | regex_replace('^[-*•]\\s*', '') %}
            {% endif %}
            {% if line | trim %}{% set ns.lines = ns.lines + ['- ' ~ line] %}{% endif %}
          {% endfor %}
        {% endif %}
        {# No usable lines stays empty: notifications then show just the summary, and the
           dashboard's Issues card points at the summary instead of repeating it. #}
        {{ ns.lines | join('\n') }}

  - variables:
      analysis:
        status: "{{ ai.data.status | default('warning') | lower }}"
        summary: "{{ ai.data.summary | default('The AI returned no summary.') }}"
        issues: "{{ issues_text }}"
      notification_title: >-
        Docker {{ ai.data.status | default('warning') | lower }}:
        {{ report.stats.errors }} errors / {{ report.stats.warnings }} warnings
        in {{ window_minutes }} min
      notification_message: |-
        {{ ai.data.summary | default('') }}
        {%- if issues_text | trim %}

        {{ issues_text | trim }}
        {%- endif %}

        _{{ report.since[11:16] }}–{{ report.generated_at[11:16] }} · {{ report.stats.containers_with_output }} containers with output · {{ report.stats.raw_lines }} lines_
      # Same content as plain text for phone pushes: no markdown, "•" bullets,
      # "→" arrows, and kept under the ~4 KB push payload limit.
      phone_message: >-
        {% set ns = namespace(lines=[ai.data.summary | default('') | trim]) %}
        {% for l in (issues_text | trim).split('\n') if l | trim %}
          {% set ns.lines = ns.lines + ['• ' ~ (l | trim | regex_replace('^-\\s*', '') | replace(' -> ', ' → '))] %}
        {% endfor %}
        {% set text = ns.lines | join('\n\n') %}
        {{ text[:3000] ~ ('…' if text | length > 3000 else '') }}

  - event: docker_log_analysis
    event_data:
      status: "{{ analysis.status }}"
      summary: "{{ analysis.summary }}"
      issues: "{{ analysis.issues }}"
      analysed: true
      <<: *report_fields

  - condition: template
    value_template: >-
      {{ severity_rank.get(analysis.status, 1) >= severity_rank.get(min_severity, 1) }}

  - if: "{{ persistent_notification }}"
    then:
      - action: persistent_notification.create
        data:
          notification_id: docker_log_analysis
          title: "{{ notification_title }}"
          message: "{{ notification_message }}"

  - choose: []
    default: !input notify_actions
